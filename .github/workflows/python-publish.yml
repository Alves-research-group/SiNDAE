# Publish sindae to PyPI when a GitHub Release is published.
# Auth: PyPI API token in the repository secret PYPI_API_TOKEN.

name: Upload Python Package on PyPI 🐍 📦

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The release tag is the source of truth for the published version.
      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version = \".*\"$/version = \"${VERSION}\"/" pyproject.toml
          grep -qx "version = \"${VERSION}\"" pyproject.toml \
            || { echo "::error::Could not set version ${VERSION} in pyproject.toml"; exit 1; }

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false  # unavailable with token auth
